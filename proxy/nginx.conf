# open-shield — OpenResty main configuration.
#
# The proxy is the only entry point for web traffic (RF-01). It terminates the
# connection, hands every request to the rules engine for a verdict, and
# forwards what survives.

# Lua reads configuration through os.getenv, and nginx only exposes the
# variables listed here to worker processes.
env OS_ENGINE_URL;
env OS_DECIDE_TIMEOUT_MS;
env OS_MAX_BODY_INSPECT_BYTES;
env OS_FAIL_MODE;
env OS_ENGINE_KEEPALIVE_MS;
env OS_ENGINE_KEEPALIVE_POOL;

worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Carries a WebSocket upgrade through to the backend, and sends "close" for
    # ordinary requests so keepalive is not broken by an empty Connection
    # header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The request id generated here is the correlation id of §3.2. It travels
    # to the engine, into the audit entry, and on to the backend, so one
    # request can be followed across all three.
    log_format openshield escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"upstream_ms":"$upstream_response_time",'
        '"total_ms":$request_time,"user_agent":"$http_user_agent"}';

    # This is the operational log of §6.3: short retention, for debugging. It is
    # not the audit log — that one lives in PostgreSQL with its hash chain, and
    # is written by the engine.
    access_log /dev/stdout openshield;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout  65;
    client_max_body_size 25m;

    # The Lua access phase reads the body, so it has to be buffered in memory
    # up to this size. Beyond it nginx spills to disk and the body is reported
    # to the engine as truncated rather than read back off the filesystem.
    client_body_buffer_size 64k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/etc/openresty/lua/?.lua;;";

    # One shared cache of compiled Lua across workers.
    lua_code_cache on;

    include /etc/nginx/conf.d/*.conf;
}
